##
## ClamAV Daemon Configuration
##

LogFile /var/log/clamav/clamd.log
LogTime yes
PidFile /run/clamav/clamd.pid
TemporaryDirectory /tmp
DatabaseDirectory /var/lib/clamav

User clamav
LocalSocket /run/clamav/clamd.ctl
LocalSocketGroup clamav
LocalSocketMode 660

# System Exclusions (Critical to stop system choking)
ExcludePath ^/proc/
ExcludePath ^/sys/
ExcludePath ^/dev/
ExcludePath ^/usr/
ExcludePath ^/lib/
ExcludePath ^/var/log/clamav/quarantine/
ExcludePath ^/home/[^/]+/\.cache/
ExcludePath ^/home/[^/]+/\.config/mozilla/firefox/.*/storage/
ExcludePath ^/home/[^/]+/\.local/share/klipper/
ExcludePath ^/home/[^/]+/\.local/share/Steam/
ExcludePath ^/home/[^/]+/\.steam/
ExcludePath ^/home/[^/]+/\.cache/
ExcludePath ^/tmp/\.clamav
ExcludePath ^/tmp/clamav


# Disable archive scanning in clamd for performance
ScanArchive no

# On-Access Settings
OnAccessIncludePath /home
OnAccessIncludePath /mnt
OnAccessPrevention yes
OnAccessDenyOnError yes
OnAccessExtraScanning yes
# Exclude ClamAV user from loop scans
OnAccessExcludeUname clamav
OnAccessExcludeUname root

# Tell clamd to trigger the alert script on any virus detection
# Path to execute when a threat is found
VirusEvent /usr/local/bin/clam-notify
